<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>H-A House Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
    }

    #logout {
      background: #dc2626;
      color: white;
      border: 0;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
    }

    .container {
      padding: 25px;
      max-width: 1200px;
      margin: auto;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

      gap: 18px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .card h3 {
      margin-top: 0;
      color: #6b7280;
      font-size: 15px;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
    }

    .section {
      margin-top: 30px;
      background: white;
      padding: 25px;
      border-radius: 14px;
    }

    .section h2 {
      margin-top: 0;
    }

    .status {
      padding: 12px;
      background: #ecfdf5;
      color: #047857;
      border-radius: 8px;
    }

  </style>

</head>

<body>

<header>

  <h2>H-A House Admin</h2>

  <button id="logout">
    Logout
  </button>

</header>

<div class="container">

  <div class="welcome">
    <h1>Dashboard</h1>
    <p id="adminEmail">Loading...</p>
  </div>

  <div class="cards">

    <div class="card">

      <h3>Total Products</h3>

      <div class="number"
           id="productsCount">
        0
      </div>

    </div>

    <div class="card">

      <h3>Total Orders</h3>

      <div class="number"
           id="ordersCount">
        0
      </div>

    </div>

    <div class="card">

      <h3>Affiliate Products</h3>

      <div class="number"
           id="affiliateCount">
        0
      </div>

    </div>

  </div>

  <div class="section">

    <h2>System Status</h2>

    <div class="status">
      H-A House Admin connected to Supabase.
    </div>

  </div>

</div>


<script>

async function checkAdmin() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {

    window.location.href = "login.html";

    return null;
  }

  const { data: admin, error } =
    await supabaseClient
      .from("admin_profiles")
      .select("id,email,role")
      .eq("id", user.id)
      .maybeSingle();

  if (error || !admin) {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";

    return null;
  }

  document.getElementById("adminEmail").textContent =
    "Logged in as: " + admin.email;

  return user;

}


async function loadDashboard() {

  const user = await checkAdmin();

  if (!user) return;


  const { count: productsCount } =
    await supabaseClient
      .from("products")
      .select("*", {
        count: "exact",
        head: true
      });

  document.getElementById("productsCount").textContent =
    productsCount || 0;


  const { count: ordersCount } =
    await supabaseClient
      .from("orders")
      .select("*", {
        count: "exact",
        head: true
      });

  document.getElementById("ordersCount").textContent =
    ordersCount || 0;


  const { count: affiliateCount } =
    await supabaseClient
      .from("affiliates")
      .select("*", {
        count: "exact",
        head: true
      });

  document.getElementById("affiliateCount").textContent =
    affiliateCount || 0;

}


document
  .getElementById("logout")
  .addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";

  });


loadDashboard();

</script>

</body>

</html>
