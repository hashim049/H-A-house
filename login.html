<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H-A House Admin Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f1eb;min-height:100vh;display:grid;place-items:center;color:#241f1a}
.box{width:min(420px,92%);background:#fff;padding:30px;border-radius:18px;box-shadow:0 15px 50px #0001}
h1{text-align:center;margin:0 0 6px}.sub{text-align:center;color:#777;margin-bottom:25px}
label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:700;cursor:pointer}
#msg{text-align:center;min-height:22px;margin-top:14px}
</style>
</head>
<body>
<div class="box">
<h1>H-A House</h1><div class="sub">Admin Panel</div>
<form id="loginForm">
<label>Email</label><input id="email" type="email" value="mhashim92111@gmail.com" required>
<label>Password</label><input id="password" type="password" required>
<button>Login</button>
<div id="msg"></div>
</form>
</div>
<script>
const form=document.getElementById("loginForm"),msg=document.getElementById("msg");
form.addEventListener("submit",async e=>{
 e.preventDefault(); msg.textContent="Logging in..."; msg.style.color="#555";
 const {data,error}=await supabaseClient.auth.signInWithPassword({
   email:document.getElementById("email").value.trim(),
   password:document.getElementById("password").value
 });
 if(error){msg.textContent=error.message;msg.style.color="crimson";return}
 const {data:admin,error:ae}=await supabaseClient.from("admin_profiles").select("id,email,role").eq("id",data.user.id).maybeSingle();
 if(ae||!admin){await supabaseClient.auth.signOut();msg.textContent="Admin access not found.";msg.style.color="crimson";return}
 location.href="dashboard.html";
});
</script>
</body>
</html>
