<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H-A House Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f3ef;color:#211d18}
header{background:#211d18;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h2{margin:0;font-size:20px}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}
.logout{background:#d33;color:#fff}.wrap{max-width:1200px;margin:auto;padding:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 5px 25px #0000000a}.card small{color:#777}.num{font-size:30px;font-weight:800;margin-top:8px}
.panel{background:#fff;border-radius:14px;padding:20px;margin-top:18px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px 9px;border-bottom:1px solid #eee;text-align:left;font-size:14px;vertical-align:top}
select{padding:8px;border:1px solid #ddd;border-radius:8px}.wa{background:#168c45;color:#fff;text-decoration:none;padding:8px 10px;border-radius:8px;display:inline-block}
#msg{margin:10px 0;color:#777}
</style>
</head>
<body>
<header><h2>H-A House Admin</h2><button class="logout" id="logout">Logout</button></header>
<div class="wrap">
<p id="adminEmail">Checking admin...</p>
<div class="stats">
<div class="card"><small>Total Orders</small><div class="num" id="total">0</div></div>
<div class="card"><small>New Orders</small><div class="num" id="new">0</div></div>
<div class="card"><small>Paid Orders</small><div class="num" id="paid">0</div></div>
<div class="card"><small>Revenue</small><div class="num" id="revenue">₹0</div></div>
</div>
<div class="panel"><h2>Orders</h2><div id="msg">Loading orders...</div>
<table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Amount</th><th>Payment</th><th>Status</th><th>WhatsApp</th></tr></thead>
<tbody id="orders"></tbody></table></div>
</div>
<script>
async function init(){
 const {data:{user}}=await supabaseClient.auth.getUser();
 if(!user){location.href="login.html";return}
 const {data:admin,error}=await supabaseClient.from("admin_profiles").select("email,role").eq("id",user.id).maybeSingle();
 if(error||!admin){await supabaseClient.auth.signOut();location.href="login.html";return}
 document.getElementById("adminEmail").textContent="Logged in: "+admin.email;
 await loadOrders();
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function loadOrders(){
 const {data,error}=await supabaseClient.from("orders").select("*").order("created_at",{ascending:false});
 if(error){document.getElementById("msg").textContent="Orders error: "+error.message;return}
 const rows=data||[];
 document.getElementById("total").textContent=rows.length;
 document.getElementById("new").textContent=rows.filter(x=>x.order_status==="new").length;
 document.getElementById("paid").textContent=rows.filter(x=>x.payment_status==="paid").length;
 document.getElementById("revenue").textContent="₹"+rows.filter(x=>x.payment_status==="paid").reduce((s,x)=>s+Number(x.total_amount||0),0).toLocaleString("en-IN");
 const body=document.getElementById("orders"); body.innerHTML="";
 for(const o of rows){
   const items=Array.isArray(o.items)?o.items:[];
   const itemText=items.map(i=>`${esc(i.name)} × ${esc(i.quantity)}`).join("<br>");
   const wa="https://wa.me/"+String(o.phone||"").replace(/\D/g,"")+"?text="+encodeURIComponent("H-A House order "+o.order_number+" status: "+o.order_status);
   const tr=document.createElement("tr");
   tr.innerHTML=`<td><b>${esc(o.order_number)}</b><br><small>${new Date(o.created_at).toLocaleString("en-IN")}</small></td>
   <td>${esc(o.customer_name)}<br>${esc(o.phone)}<br>${esc(o.address)}</td>
   <td>${itemText||"-"}</td><td>₹${Number(o.total_amount||0).toLocaleString("en-IN")}</td>
   <td>${esc(o.payment_status)}</td>
   <td><select data-id="${o.id}" class="status"><option value="new">New</option><option value="confirmed">Confirmed</option><option value="processing">Processing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></td>
   <td><a class="wa" target="_blank" rel="noopener" href="${wa}">WhatsApp</a></td>`;
   body.appendChild(tr);
   tr.querySelector("select").value=o.order_status||"new";
 }
 document.querySelectorAll(".status").forEach(s=>s.addEventListener("change",async e=>{
   const id=e.target.dataset.id, status=e.target.value;
   const {error}=await supabaseClient.from("orders").update({order_status:status}).eq("id",id);
   if(error) alert(error.message); else loadOrders();
 }));
 document.getElementById("msg").textContent=rows.length?rows.length+" order(s)":"No orders yet";
}
document.getElementById("logout").onclick=async()=>{await supabaseClient.auth.signOut();location.href="login.html"};
init();
</script>
</body>
</html>
