<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H A House - Admin</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f1eb;
    color:#211c17;
}

.top{
    background:#211c17;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.top h2{margin:0}

.logout{
    background:white;
    color:#211c17;
    border:0;
    padding:9px 15px;
    border-radius:7px;
    cursor:pointer;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:0 18px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 25px #00000012;
}

label{
    display:block;
    font-weight:bold;
    margin:16px 0 6px;
}

input,textarea,select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:100px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.info{
    background:#f4f1ec;
    border-radius:10px;
    padding:15px;
    margin:15px 0;
    font-size:14px;
}

.info strong{
    display:block;
    margin-bottom:5px;
}

.id{
    word-break:break-all;
    color:#765333;
}

.image-box{
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    margin-top:15px;
}

.preview{
    width:100%;
    height:180px;
    object-fit:contain;
    background:#f5f5f5;
    border-radius:8px;
    margin-top:10px;
}

.save{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:0;
    border-radius:9px;
    background:#168c45;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.save:disabled{
    background:#999;
    cursor:not-allowed;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
}

.success{
    background:#e5f7ea;
    color:#126b32;
}

.error{
    background:#fde8e8;
    color:#a11;
}

.loading{
    background:#fff4d6;
    color:#765333;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

@media(max-width:650px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="top">
    <h2>H A House — Admin</h2>
    <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card">

<h2>Product Management</h2>

<p>
Yahan se website ka product, price aur images change karo.
</p>

<div id="loading" class="loading">
⏳ Supabase se product load ho raha hai...
</div>

<div class="info">

<strong>Product ID</strong>

<div id="productId" class="id">
Loading...
</div>

</div>


<label>Product Name</label>

<input
    id="name"
    type="text"
    placeholder="Product name"
>


<label>Slug</label>

<input
    id="slug"
    type="text"
    placeholder="product-slug"
>


<label>Description</label>

<textarea
    id="description"
    placeholder="Product description"
></textarea>


<div class="grid">

<div>

<label>Price ₹</label>

<input
    id="price"
    type="number"
    min="0"
>

</div>


<div>

<label>Status</label>

<select id="active">

<option value="true">
Active
</option>

<option value="false">
Hidden
</option>

</select>

</div>

</div>


<div class="image-box">

<label>Image 1 URL</label>

<input
    id="image1"
    type="text"
    placeholder="https://..."
>

<img
    id="preview1"
    class="preview"
    alt="Image 1 preview"
>

</div>


<div class="image-box">

<label>Image 2 URL</label>

<input
    id="image2"
    type="text"
    placeholder="https://..."
>

<img
    id="preview2"
    class="preview"
    alt="Image 2 preview"
>

</div>


<div class="image-box">

<label>Image 3 URL</label>

<input
    id="image3"
    type="text"
    placeholder="https://..."
>

<img
    id="preview3"
    class="preview"
    alt="Image 3 preview"
>

</div>


<div class="image-box">

<label>Image 4 URL</label>

<input
    id="image4"
    type="text"
    placeholder="https://..."
>

<img
    id="preview4"
    class="preview"
    alt="Image 4 preview"
>

</div>


<button
    id="saveButton"
    class="save"
    onclick="saveProduct()"
    disabled
>
⏳ PRODUCT LOAD HO RAHA HAI...
</button>


<div id="status" class="status"></div>

</div>

</div>


<script src="config.js"></script>

<script>

let productId = null;


/* =========================
   CHECK CONFIG
========================= */

if(
    typeof SUPABASE_URL === "undefined" ||
    typeof SUPABASE_KEY === "undefined"
){

    showStatus(
        "❌ config.js load nahi hua. GitHub mein config.js check karo.",
        false
    );

    document.getElementById("loading").textContent =
        "❌ Supabase configuration missing.";

}


/* =========================
   IMAGE PREVIEW
========================= */

function setupPreview(inputId, previewId){

    const input =
        document.getElementById(inputId);

    const preview =
        document.getElementById(previewId);

    input.addEventListener(
        "input",
        function(){

            preview.src =
                this.value.trim();

        }
    );

}


/* Setup all previews */

setupPreview("image1","preview1");
setupPreview("image2","preview2");
setupPreview("image3","preview3");
setupPreview("image4","preview4");


/* =========================
   LOAD PRODUCT
========================= */

async function loadProduct(){

    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/products?select=*&limit=1";


        console.log(
            "Loading:",
            url
        );


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        const responseText =
            await response.text();


        console.log(
            "Supabase response:",
            response.status,
            responseText
        );


        if(!response.ok){

            throw new Error(
                responseText ||
                "Supabase product load error"
            );

        }


        const data =
            JSON.parse(responseText);


        if(
            !Array.isArray(data) ||
            data.length === 0
        ){

            throw new Error(
                "Products table mein koi product nahi mila. RLS SELECT policy check karo."
            );

        }


        const product =
            data[0];


        /* IMPORTANT */

        productId =
            product.id;


        if(!productId){

            throw new Error(
                "Product mila lekin uski ID empty hai."
            );

        }


        /* SHOW ID */

        document.getElementById(
            "productId"
        ).textContent =
            productId;


        /* FILL FORM */

        document.getElementById(
            "name"
        ).value =
            product.name || "";


        document.getElementById(
            "slug"
        ).value =
            product.slug || "";


        document.getElementById(
            "description"
        ).value =
            product.description || "";


        document.getElementById(
            "price"
        ).value =
            product.price || 0;


        document.getElementById(
            "active"
        ).value =
            product.active === false
            ? "false"
            : "true";


        document.getElementById(
            "image1"
        ).value =
            product.image_url || "";


        document.getElementById(
            "image2"
        ).value =
            product.image_2_url || "";


        document.getElementById(
            "image3"
        ).value =
            product.image_3_url || "";


        document.getElementById(
            "image4"
        ).value =
            product.image_4_url || "";


        /* PREVIEWS */

        setPreview(
            "preview1",
            product.image_url
        );

        setPreview(
            "preview2",
            product.image_2_url
        );

        setPreview(
            "preview3",
            product.image_3_url
        );

        setPreview(
            "preview4",
            product.image_4_url
        );


        /* READY */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        const saveButton =
            document.getElementById(
                "saveButton"
            );


        saveButton.disabled = false;

        saveButton.textContent =
            "💾 SAVE PRODUCT";


        showStatus(
            "✅ Product load ho gaya. ID mil gayi.",
            true
        );


    }
    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        document.getElementById(
            "loading"
        ).textContent =
            "❌ Product load nahi hua.";


        showStatus(
            "❌ " +
            error.message,
            false
        );

    }

}


/* =========================
   IMAGE PREVIEW HELPER
========================= */

function setPreview(
    id,
    url
){

    const img =
        document.getElementById(id);

    if(url){

        img.src = url;

        img.style.display =
            "block";

    }
    else{

        img.removeAttribute("src");

        img.style.display =
            "none";

    }

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

    if(!productId){

        showStatus(
            "❌ Product ID abhi load nahi hui. Page refresh karke wait karo.",
            false
        );

        return;

    }


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.disabled = true;

    saveButton.textContent =
        "⏳ SAVING...";


    const updatedProduct = {

        name:
            document.getElementById(
                "name"
            ).value.trim(),

        slug:
            document.getElementById(
                "slug"
            ).value.trim(),

        description:
            document.getElementById(
                "description"
            ).value.trim(),

        price:
            Number(
                document.getElementById(
                    "price"
                ).value
            ),

        image_url:
            document.getElementById(
                "image1"
            ).value.trim(),

        image_2_url:
            document.getElementById(
                "image2"
            ).value.trim(),

        image_3_url:
            document.getElementById(
                "image3"
            ).value.trim(),

        image_4_url:
            document.getElementById(
                "image4"
            ).value.trim(),

        active:
            document.getElementById(
                "active"
            ).value === "true"

    };


    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/products?id=eq." +
            encodeURIComponent(
                productId
            );


        console.log(
            "Updating:",
            productId
        );


        const response =
            await fetch(
                url,
                {
                    method:"PATCH",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=representation"
                    },

                    body:
                        JSON.stringify(
                            updatedProduct
                        )
                }
            );


        const text =
            await response.text();


        console.log(
            "SAVE RESPONSE:",
            response.status,
            text
        );


        if(!response.ok){

            throw new Error(
                text ||
                "Product save nahi hua."
            );

        }


        showStatus(
            "✅ Product successfully save ho gaya!",
            true
        );


        saveButton.textContent =
            "✅ SAVED";


        /* Reload latest data */

        setTimeout(
            loadProduct,
            700
        );


    }
    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        showStatus(
            "❌ Save error: " +
            error.message,
            false
        );


        saveButton.disabled =
            false;

        saveButton.textContent =
            "💾 SAVE PRODUCT";

    }

}


/* =========================
   STATUS
========================= */

function showStatus(
    message,
    success
){

    const box =
        document.getElementById(
            "status"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    box.className =
        "status " +
        (
            success
            ? "success"
            : "error"
        );

}


/* =========================
   LOGOUT
========================= */

function logout(){

    window.location.href =
        "login.html";

}


/* =========================
   START
========================= */

loadProduct();

</script>

</body>
</html>
